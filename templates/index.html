<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapCoord</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f8f8f8;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      padding: 20px 40px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    header p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .upload-area {
      background: #fff;
      border: 2px dashed #ddd;
      border-radius: 12px;
      padding: 50px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover { border-color: #aaa; }

    .upload-area p {
      font-size: 15px;
      color: #888;
      margin-bottom: 16px;
    }

    .upload-btn {
      display: inline-block;
      background: #1a1a1a;
      color: #fff;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }

    #file-input { display: none; }

    .preview-section {
      display: none;
      margin-top: 32px;
    }

    .preview-section h2 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .query-preview img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .search-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      background: #1a1a1a;
      color: #fff;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .search-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 32px;
      color: #888;
      font-size: 14px;
    }

    .results-section {
      display: none;
      margin-top: 40px;
    }

    .results-section h2 {
      font-size: 14px;
      color: #888;
      margin-bottom: 16px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .result-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .result-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .result-card .score {
      padding: 8px 12px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>SnapCoord</h1>
    <p>服の写真を撮るだけで、コーデのアイデアが見つかる</p>
  </header>

  <div class="container">
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <p>手持ちの服の写真をアップロードしてください</p>
      <button class="upload-btn">写真を選ぶ</button>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="preview-section" id="preview-section">
      <h2>選んだ服</h2>
      <div class="query-preview">
        <img id="query-preview-img" src="" alt="選んだ服">
      </div>
      <button class="search-btn" id="search-btn">似ているコーデを探す</button>
    </div>

    <div class="loading" id="loading">
      AIが解析しています...
    </div>

    <div class="results-section" id="results-section">
      <h2>似ているコーデ</h2>
      <div class="results-grid" id="results-grid"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const previewSection = document.getElementById('preview-section');
    const queryPreviewImg = document.getElementById('query-preview-img');
    const searchBtn = document.getElementById('search-btn');
    const loading = document.getElementById('loading');
    const resultsSection = document.getElementById('results-section');
    const resultsGrid = document.getElementById('results-grid');

    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (!selectedFile) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        queryPreviewImg.src = ev.target.result;
        previewSection.style.display = 'block';
        resultsSection.style.display = 'none';
        resultsGrid.innerHTML = '';
      };
      reader.readAsDataURL(selectedFile);
    });

    searchBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      searchBtn.disabled = true;
      loading.style.display = 'block';
      resultsSection.style.display = 'none';
      resultsGrid.innerHTML = '';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('/search', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        data.results.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'result-card';
          card.innerHTML = `
            <img src="data:image/jpeg;base64,${item.image}" alt="コーデ">
            <div class="score">類似度: ${item.score}</div>
          `;
          resultsGrid.appendChild(card);
        });

        resultsSection.style.display = 'block';
      } catch (err) {
        alert('エラーが発生しました。もう一度お試しください。');
      } finally {
        loading.style.display = 'none';
        searchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
